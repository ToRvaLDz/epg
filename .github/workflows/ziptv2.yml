# Immagine ziptv2: ogni notte rebase del branch `ziptv2` su iptv-org/epg master,
# test dei siti che patchiamo, build e push su ghcr.io/torvaldz/ziptv2-epg:ziptv2.
# Il rebase resta locale al job (niente push del branch): se va in conflitto o
# un test fallisce il job fallisce e l'ultima immagine buona resta quella.
name: ziptv2 image

on:
  workflow_dispatch:
    inputs:
      force:
        description: Ricostruisci anche se l'immagine per questa revision esiste già
        type: boolean
        default: false
  push:
    branches: [ziptv2]
  schedule:
    - cron: '0 1 * * *' # prima del grab delle 03:00 UTC su Margie

concurrency:
  group: ziptv2-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/torvaldz/ziptv2-epg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ziptv2
          fetch-depth: 0

      - name: Rebase su upstream master
        id: rebase
        run: |
          # upstream ha blob CRLF + `eol=crlf` in .gitattributes: dopo il checkout
          # git vede tutto "modificato" e il rebase rifiuta di partire. -text =
          # byte dei blob così come sono, albero pulito.
          echo '* -text' >> .git/info/attributes
          git reset -q --hard
          git config user.name "ziptv2-bot"
          git config user.email "ziptv2-bot@users.noreply.github.com"
          git remote add upstream https://github.com/iptv-org/epg.git
          git fetch --no-tags upstream master
          ours=$(git rev-parse --short HEAD)
          git rebase upstream/master || { git rebase --abort; echo "::error::rebase su upstream in conflitto: risolvere a mano sul branch ziptv2"; exit 1; }
          echo "upstream=$(git rev-parse --short upstream/master)" >> "$GITHUB_OUTPUT"
          echo "ours=$ours" >> "$GITHUB_OUTPUT"
          echo "sites=$(git diff --name-only upstream/master HEAD -- sites | cut -d/ -f2 | sort -u | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # Se upstream e il nostro branch non sono cambiati l'immagine di questa revision è già
      # su ghcr: ripubblicare :ziptv2 con lo stesso codice cambia solo l'image ID e fa
      # ricreare inutilmente il container su Margie all'update notturno.
      # Si salta solo se :ziptv2 punta proprio a quella revision: dopo un reset del branch
      # a un commit già buildato il tag esiste ma :ziptv2 è su un'altra immagine.
      - name: Immagine già pubblicata?
        id: exists
        if: ${{ !inputs.force }}
        run: |
          tag="${{ env.IMAGE }}:ziptv2-${{ steps.rebase.outputs.upstream }}-${{ steps.rebase.outputs.ours }}"
          digest() { docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}' 2>/dev/null || true; }
          rev=$(digest "$tag")
          latest=$(digest "${{ env.IMAGE }}:ziptv2")
          if [ -n "$rev" ] && [ "$rev" = "$latest" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag già pubblicata e :ziptv2 punta lì, niente build"
          fi

      - uses: actions/setup-node@v7
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Test dei siti patchati
        if: steps.exists.outputs.skip != 'true' && steps.rebase.outputs.sites != ''
        env:
          TZ: Pacific/Nauru # come `npm test` upstream
        run: |
          npm ci --no-audit --no-fund
          for site in ${{ steps.rebase.outputs.sites }}; do
            npx jest --runInBand "sites/$site"
          done

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.skip != 'true'

      - uses: docker/login-action@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          file: .ziptv2/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:ziptv2
            ${{ env.IMAGE }}:ziptv2-${{ steps.rebase.outputs.upstream }}-${{ steps.rebase.outputs.ours }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rebase.outputs.upstream }}+${{ steps.rebase.outputs.ours }}
            org.opencontainers.image.description=iptv-org/epg + patch ziptv2
          cache-from: type=gha
          cache-to: type=gha,mode=max
